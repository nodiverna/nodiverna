# Builds, signs and publishes the Windows agent as a GitHub release. The owner
# starts each run by hand: on main it publishes the release agent-vX.Y.Z, on dev
# the pre-release agent-vX.Y.Z-dev.<sha7> (the first 7 characters of the commit;
# not marked latest, no changelog file needed). The version comes from <Version>
# in ServerDesk/agent/v3/ServerDesk.Agent.csproj; a tag that exists already ends
# the run in the plan, and a dev run stops while agent-vX.Y.Z exists.
# Before the first run: create the GitHub environment agent-signing with the
# owner as required reviewer and the deployment branches main and dev (a dev run
# stops at the sign job until dev is allowed there). Store the content of
# .data/release-private.pem there as the secret AGENT_RELEASE_SIGNING_KEY,
# never as a repository secret.
# Only the sign job sees the key. It runs no package install and no build tool.
# It downloads the build outside the checkout, copies only the expected files
# into it and signs them with scripts/sign-agent-release.mjs, which uses only
# Node built-ins and writes the record to .build/agent-v3-release.json. The CI
# never commits. The image holds no agent: portals import this GitHub release.
name: Agent release

on:
  workflow_dispatch:

permissions:
  contents: read

# One group for all runs: two runs never release the same version at once.
concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  # Stops the run before the build on a wrong branch, a bad version, a missing
  # changelog (main only) or an existing tag.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      # The full history with all tags: the plan reads the agent-vX.Y.Z tags.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Plan the agent release
        id: plan
        working-directory: ServerDesk
        run: node scripts/agent-release.mjs plan

  # Third-party build code (pnpm packages, NuGet, dotnet) runs only here,
  # without any secret.
  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      # The pnpm version of packageManager in ServerDesk/package.json.
      - name: Select pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      # No lifecycle scripts: the packaging needs only fflate.
      - name: Install the packaging dependencies
        working-directory: ServerDesk
        run: pnpm install --frozen-lockfile --ignore-scripts

      # dotnet publish, then --version and the self-tests on the packaged EXE. The
      # hosted runner is elevated, so the service lifecycle self-test must run.
      # The build takes the version of the plan (on dev with -dev.<sha7>).
      - name: Build and self-test the agent
        working-directory: ServerDesk
        env:
          SERVERDESK_AGENT_SMOKE_MODE: native
          SERVERDESK_AGENT_LIFECYCLE_TEST: required
          SERVERDESK_AGENT_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/build-agent-v3.mjs

      - name: Check the build version
        working-directory: ServerDesk
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          actual=$(node -p "require('./.build/agent-v3-artifact.json').version")
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::The build has the version '$actual', not '$VERSION'."
            exit 1
          fi

      # The approver of agent-signing compares these values with the job summary
      # of the sign job and with the signed manifest.
      - name: Show the build hashes
        working-directory: ServerDesk
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/agent-release.mjs digests --version "$VERSION"

      # The paths stay relative to ServerDesk, so the sign job downloads them there.
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            ServerDesk/.build/agent-v3-artifact.json
            ServerDesk/.build/ServerDesk-Agent-${{ needs.plan.outputs.version }}-win-x64.zip
            ServerDesk/.build/agent-v3-publish/ServerDesk.Agent.exe

  # Waits for the approval of the agent-signing environment. Only Node and the
  # scripts of the checkout run here: no package install and no build tool. The
  # build artifact never overwrites a file of the checkout.
  sign:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: agent-signing
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Outside the checkout: the build job runs third-party code, so its artifact
      # could hold any file, also a replacement for a script of the checkout.
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-build
          path: ${{ runner.temp }}/agent-build

      # Copies only the expected files of this version and refuses links and any other entry.
      - name: Copy the expected build files
        working-directory: ServerDesk
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/agent-release.mjs stage --dir "$RUNNER_TEMP/agent-build" --version "$VERSION"

      # The only step with the key. The key file is readable only by the runner
      # user and is removed when the step ends, also on an error.
      - name: Sign the release record
        working-directory: ServerDesk
        env:
          RELEASE_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::The secret AGENT_RELEASE_SIGNING_KEY of the environment agent-signing is empty."
            exit 1
          fi
          umask 077
          KEY_FILE="$RUNNER_TEMP/agent-release-key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$KEY_FILE"
          unset RELEASE_KEY
          SERVERDESK_RELEASE_KEY_FILE="$KEY_FILE" node scripts/sign-agent-release.mjs

      # Reads .build/agent-v3-release.json. Fails for a record without a signature
      # or with files that differ from it.
      - name: Collect the release assets
        working-directory: ServerDesk
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/agent-release.mjs assets --out "$RUNNER_TEMP/agent-release" --version "$VERSION"

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-release
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/agent-release

  # Checks the signature against the pinned key before it changes anything on
  # GitHub. A failed run here can use "Re-run failed jobs".
  release:
    needs: [plan, sign]
    if: needs.plan.outputs.release == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-release
          path: ${{ runner.temp }}/agent-release

      - name: Verify the release assets
        working-directory: ServerDesk
        run: node scripts/agent-release.mjs verify --dir "$RUNNER_TEMP/agent-release" --version "$VERSION" --check-notes

      # Atomic through the refs API: an existing tag on this commit is a re-run,
      # an existing tag on another commit stops the job.
      - name: Create the tag
        run: |
          if gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null; then
            echo "Created the tag $TAG on $SHA."
            exit 0
          fi
          existing=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha') \
            || { echo "::error::Could not create or read the tag $TAG."; exit 1; }
          if [ "$existing" != "$SHA" ]; then
            echo "::error::The tag $TAG points to $existing, not to $SHA."
            exit 1
          fi
          echo "The tag $TAG already points to $SHA."

      # A draft first, published after the upload: a release is never visible
      # without all assets. A re-run completes a draft and leaves a published
      # release as it is. The app release vX.Y.Z stays "Latest". A dev run creates
      # a pre-release; publishing the draft keeps the pre-release flag.
      - name: Create the GitHub release
        run: |
          cd "$RUNNER_TEMP/agent-release"
          set -- "ServerDesk-Agent-$VERSION-win-x64.zip" "ServerDesk-Agent-$VERSION-win-x64.exe" \
            "ServerDesk-Agent-$VERSION-release.json" "ServerDesk-Agent-$VERSION-manifest.json" "ServerDesk-Agent-$VERSION-manifest.sig"
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2> /dev/null); then
            if [ "$draft" != "true" ]; then
              echo "The release $TAG is published already. Nothing changed."
              exit 0
            fi
            echo "Completing the draft release $TAG."
            gh release upload "$TAG" "$@" --clobber
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" "$@" --verify-tag --draft --prerelease --latest=false --title "Agent $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "$@" --verify-tag --draft --latest=false --title "Agent $VERSION" --notes-file notes.md
          fi
          gh release edit "$TAG" --draft=false --latest=false
          echo "Published the release $TAG."
