# Builds, signs and publishes one agent plugin as a GitHub release. The owner
# starts each run by hand and picks the plugin: on main it publishes the release
# plugin-<name>-vX.Y.Z, on dev the pre-release plugin-<name>-vX.Y.Z-dev.<sha7>
# (the first 7 characters of the commit; not marked latest, no changelog file
# needed). The version comes from <Version> in
# ServerDesk/agent/plugins/<name>/ServerDesk.Plugin.<Name>.csproj; a tag that
# exists already ends the run in the plan, and a dev run stops while
# plugin-<name>-vX.Y.Z exists.
# The run signs with the publisher key of the agent releases: the GitHub
# environment agent-signing with the owner as required reviewer, the deployment
# branches main and dev (a dev run stops at the sign job until dev is allowed
# there) and the secret AGENT_RELEASE_SIGNING_KEY (see agent-release.yml).
# Only the sign job sees the key. It runs no package install and no build tool.
# It downloads the build outside the checkout, copies only the expected files
# into it and signs them with scripts/sign-plugin-release.mjs, which uses only
# Node built-ins. The agent ZIP and its workflow do not change: a plugin is a
# separate EXE with its own release.
name: Plugin release

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: The plugin to release
        required: true
        type: choice
        options:
          - dhcp
          - dns

permissions:
  contents: read

# One group for all runs: two runs never release the same version at once.
concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  # Stops the run before the build on a wrong branch, a bad version, a missing
  # changelog or an existing tag.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.plan.outputs.name }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      # The full history with all tags: the plan reads the plugin-<name>-vX.Y.Z tags.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Plan the plugin release
        id: plan
        working-directory: ServerDesk
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: node scripts/plugin-release.mjs plan --plugin "$PLUGIN"

  # Third-party build code (NuGet, dotnet) runs only here, without any secret.
  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      # No package install: the build script uses Node built-ins only.
      # dotnet publish, then --version and --self-test on the packaged EXE.
      - name: Build and self-test the plugin
        working-directory: ServerDesk
        env:
          PLUGIN: ${{ needs.plan.outputs.name }}
          SERVERDESK_PLUGIN_VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/build-plugin.mjs --plugin "$PLUGIN"

      - name: Check the build version
        working-directory: ServerDesk
        env:
          PLUGIN: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          actual=$(node -p "require('./.build/plugin-' + process.env.PLUGIN + '-artifact.json').version")
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::The build has the version '$actual', not '$VERSION'."
            exit 1
          fi

      # The approver of agent-signing compares these values with the job summary
      # of the sign job and with the signed manifest.
      - name: Show the build hashes
        working-directory: ServerDesk
        env:
          PLUGIN: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/plugin-release.mjs digests --plugin "$PLUGIN" --version "$VERSION"

      # upload-artifact stores the files relative to the common folder of these
      # paths, so the artifact root is ServerDesk/.build and the entries have no
      # .build/ prefix. The sign job copies the expected files back into .build/.
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            ServerDesk/.build/plugin-${{ needs.plan.outputs.name }}-artifact.json
            ServerDesk/.build/plugin-${{ needs.plan.outputs.name }}-publish/*.exe

  # Waits for the approval of the agent-signing environment. Only Node and the
  # scripts of the checkout run here: no package install and no build tool. The
  # build artifact never overwrites a file of the checkout.
  sign:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: agent-signing
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Outside the checkout: the build job runs third-party code, so its artifact
      # could hold any file, also a replacement for a script of the checkout.
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-build
          path: ${{ runner.temp }}/plugin-build

      # Copies only the expected files of this version and refuses links and any other entry.
      - name: Copy the expected build files
        working-directory: ServerDesk
        env:
          PLUGIN: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/plugin-release.mjs stage --plugin "$PLUGIN" --dir "$RUNNER_TEMP/plugin-build" --version "$VERSION"

      # The only step with the key. The key file is readable only by the runner
      # user and is removed when the step ends, also on an error.
      - name: Sign the release record
        working-directory: ServerDesk
        env:
          PLUGIN: ${{ needs.plan.outputs.name }}
          RELEASE_KEY: ${{ secrets.AGENT_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::The secret AGENT_RELEASE_SIGNING_KEY of the environment agent-signing is empty."
            exit 1
          fi
          umask 077
          KEY_FILE="$RUNNER_TEMP/plugin-release-key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$KEY_FILE"
          unset RELEASE_KEY
          SERVERDESK_RELEASE_KEY_FILE="$KEY_FILE" node scripts/sign-plugin-release.mjs --plugin "$PLUGIN"

      # Fails for a record without a signature or with an EXE that differs from it.
      - name: Collect the release assets
        working-directory: ServerDesk
        env:
          PLUGIN: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/plugin-release.mjs assets --plugin "$PLUGIN" --out "$RUNNER_TEMP/plugin-release" --version "$VERSION"

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-release
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/plugin-release

  # Checks the signature against the pinned key before it changes anything on
  # GitHub. A failed run here can use "Re-run failed jobs".
  release:
    needs: [plan, sign]
    if: needs.plan.outputs.release == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      PLUGIN: ${{ needs.plan.outputs.name }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-release
          path: ${{ runner.temp }}/plugin-release

      - name: Verify the release assets
        working-directory: ServerDesk
        run: node scripts/plugin-release.mjs verify --plugin "$PLUGIN" --dir "$RUNNER_TEMP/plugin-release" --version "$VERSION" --check-notes

      # Atomic through the refs API: an existing tag on this commit is a re-run,
      # an existing tag on another commit stops the job.
      - name: Create the tag
        run: |
          if gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null; then
            echo "Created the tag $TAG on $SHA."
            exit 0
          fi
          existing=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha') \
            || { echo "::error::Could not create or read the tag $TAG."; exit 1; }
          if [ "$existing" != "$SHA" ]; then
            echo "::error::The tag $TAG points to $existing, not to $SHA."
            exit 1
          fi
          echo "The tag $TAG already points to $SHA."

      # A draft first, published after the upload: a release is never visible
      # without all assets. A re-run completes a draft and leaves a published
      # release as it is. The app release vX.Y.Z stays "Latest". A dev run creates
      # a pre-release; publishing the draft keeps the pre-release flag.
      - name: Create the GitHub release
        run: |
          cd "$RUNNER_TEMP/plugin-release"
          set -- "ServerDesk-Plugin-$PLUGIN-$VERSION-win-x64.exe" "ServerDesk-Plugin-$PLUGIN-$VERSION-release.json" \
            "ServerDesk-Plugin-$PLUGIN-$VERSION-manifest.json" "ServerDesk-Plugin-$PLUGIN-$VERSION-manifest.sig"
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2> /dev/null); then
            if [ "$draft" != "true" ]; then
              echo "The release $TAG is published already. Nothing changed."
              exit 0
            fi
            echo "Completing the draft release $TAG."
            gh release upload "$TAG" "$@" --clobber
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" "$@" --verify-tag --draft --prerelease --latest=false --title "Plugin $PLUGIN $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "$@" --verify-tag --draft --latest=false --title "Plugin $PLUGIN $VERSION" --notes-file notes.md
          fi
          gh release edit "$TAG" --draft=false --latest=false
          echo "Published the release $TAG."
