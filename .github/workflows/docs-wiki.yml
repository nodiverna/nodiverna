# Mirrors the documentation into the GitHub wiki of nodiverna/nodiverna.
# ServerDesk/docs/ is the source: pull requests change it, and the repo tests
# check it. ServerDesk/scripts/wiki-mirror.mjs converts the docs into wiki pages
# with a Home page, a sidebar and rewritten links, and this workflow replaces
# the whole wiki with the result. Pages of removed docs vanish from the wiki,
# and a second run on the same commit changes nothing.
# Nobody edits the wiki: each run replaces changes that you make there. Change
# ServerDesk/docs/ instead.
# The job has only contents: write and the built-in token, and no secrets; the
# token goes only into the publish step, as a per-command HTTP header of git.
# It runs only on main of nodiverna/nodiverna: forks and other branches skip it.
# The wiki must be initialised once in the GitHub UI (create the first page),
# because before that the wiki git repository does not exist.
# tests/repo/docs-wiki-workflow.mjs checks this file.
name: Docs wiki

on:
  push:
    branches: [main]
    paths:
      - 'ServerDesk/docs/**'
      - 'ServerDesk/scripts/wiki-mirror.mjs'
      - '.github/workflows/docs-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: a second run waits and then mirrors the newer commit.
concurrency:
  group: docs-wiki
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror the docs into the wiki
    if: github.repository == 'nodiverna/nodiverna' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # No package install: the converter uses Node built-ins only.
      - name: Build the wiki pages
        working-directory: ServerDesk
        run: node scripts/wiki-mirror.mjs --out "$RUNNER_TEMP/wiki-pages"

      # The token is never in a URL, in .git/config or in the log: each git
      # command that needs it gets it as a masked header through -c.
      - name: Publish the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          header="AUTHORIZATION: basic $basic"
          wiki="$RUNNER_TEMP/wiki"
          if ! git -c http.extraheader="$header" clone --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.wiki.git" "$wiki"; then
            echo "::error::Could not clone the wiki. Create the first wiki page in the GitHub UI once, then run this workflow again."
            exit 1
          fi
          branch=$(git -C "$wiki" symbolic-ref --short HEAD)
          find "$wiki" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/wiki-pages/." "$wiki/"
          git -C "$wiki" add -A
          if git -C "$wiki" diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git -C "$wiki" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Mirror ServerDesk/docs at $GITHUB_SHA"
          git -C "$wiki" -c http.extraheader="$header" push origin "HEAD:refs/heads/$branch"
          echo "Mirrored ServerDesk/docs at $GITHUB_SHA into the wiki branch $branch."
