# Publishes the runtime image (linux/amd64) to Docker Hub and, for patch and
# minor, tags the release and creates a GitHub release. It runs only by hand,
# never for pull requests, so forks never see the Docker Hub secrets.
# A run with release none pushes no release: on main it pushes edge and
# sha-<sha7>, on dev it pushes dev and dev-<sha7>. The version of such an image
# (label and SERVERDESK_VERSION) is edge-<sha7> or dev-<sha7>. Releases (patch
# and minor) run only from main.
# Before the first run: create the Docker Hub repository and the GitHub
# environment docker-hub. That environment allows the branches main and dev, and it
# holds the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (access token with
# read/write). Do not keep them as repository secrets: those are available from
# every branch. Optionally set the variable DOCKERHUB_IMAGE (default
# lostindreamz/nodiverna). The release job has no environment and needs no extra
# secret.
name: Docker image

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'patch or minor: release the next version from main. none: push edge and sha- from main, or dev and dev- from dev.'
        type: choice
        options:
          - patch
          - minor
          - none
        default: patch

permissions:
  contents: read

# One group for all runs: two releases never run at the same time, so they
# never get the same version. GitHub cancels a third run that waits.
concurrency:
  group: docker-image
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'lostindreamz/nodiverna' }}
  SMOKE_IMAGE: nodiverna:smoke

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The Docker Hub secrets exist only in this environment, and it allows only
    # main (releases, or edge and sha-) and dev (dev and dev-).
    environment: docker-hub
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      release: ${{ steps.plan.outputs.release }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      # The full history with all tags: the plan reads the vX.Y.Z tags.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Stops the run before any build on a wrong branch, a tagged HEAD or a bad
      # input. The output channel (release, edge or dev) selects the image tags.
      - name: Plan release
        id: plan
        working-directory: ServerDesk
        env:
          RELEASE: ${{ inputs.release }}
        run: node scripts/app-release.mjs plan --bump "$RELEASE" --image "docker.io/$IMAGE"

      # A version that is on Docker Hub already (for example after a failed release
      # job) stops the run before the build. Any answer except 404 stops it too.
      - name: Check Docker Hub for the version
        if: steps.plan.outputs.release == 'true'
        working-directory: ServerDesk
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: node scripts/app-release.mjs check-hub --image "docker.io/$IMAGE" --version "$VERSION"

      # Checks the lockfile against the npm advisory database. A critical or high
      # finding or a registry error stops the run before any build. The only
      # ignored advisory is in pnpm-workspace.yaml (audit.ignore).
      - name: Audit dependencies
        working-directory: ServerDesk
        run: corepack enable && pnpm check:audit

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build and test first, without any secret. The push below reuses the
      # amd64 layers from this build through the same Buildx builder, so both
      # builds get the same build-args.
      - name: Build runtime image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ServerDesk
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            SERVERDESK_VERSION=${{ steps.plan.outputs.version }}

      - name: Smoke test
        working-directory: ServerDesk
        run: node scripts/pipeline.mjs smoke --image "$SMOKE_IMAGE"

      - name: Check the image version
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$SMOKE_IMAGE" | grep -Fqx "SERVERDESK_VERSION=$VERSION" \
            || { echo "::error::The smoke image has no SERVERDESK_VERSION=$VERSION."; exit 1; }
          label=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$SMOKE_IMAGE")
          [ "$label" = "$VERSION" ] || { echo "::error::The smoke image has the version label '$label', not '$VERSION'."; exit 1; }

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.plan.outputs.version }},enable=${{ steps.plan.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.plan.outputs.version }},enable=${{ steps.plan.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ steps.plan.outputs.release == 'true' }}
            type=raw,value=edge,enable=${{ steps.plan.outputs.channel == 'edge' }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.plan.outputs.channel == 'edge' }}
            type=raw,value=dev,enable=${{ steps.plan.outputs.channel == 'dev' }}
            type=raw,value=${{ steps.plan.outputs.version }},enable=${{ steps.plan.outputs.channel == 'dev' }}
          # Keeps the version label of the Dockerfile (also edge-<sha7> or dev-<sha7>) instead of the first image tag.
          labels: |
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # linux/arm64 stays off for now. The database driver is pure JavaScript
      # now, but the arm64 image has no smoke test yet (pipeline smoke runs on
      # amd64). Add it back together with an arm64 smoke test.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ServerDesk
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVERDESK_VERSION=${{ steps.plan.outputs.version }}

  # Runs only after the image is on Docker Hub. The tag is the source of the
  # version; the CI never commits. A failed run here can use "Re-run failed jobs".
  release:
    needs: publish
    if: needs.publish.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      TAG: ${{ needs.publish.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.publish.outputs.previous_tag }}
      NOTES: ${{ needs.publish.outputs.notes }}
    steps:
      # Atomic through the refs API: an existing tag on this commit is a re-run,
      # an existing tag on another commit stops the job.
      - name: Create the tag
        run: |
          if gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" > /dev/null; then
            echo "Created the tag $TAG on $SHA."
            exit 0
          fi
          existing=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha') \
            || { echo "::error::Could not create or read the tag $TAG."; exit 1; }
          if [ "$existing" != "$SHA" ]; then
            echo "::error::The tag $TAG points to $existing, not to $SHA."
            exit 1
          fi
          echo "The tag $TAG already points to $SHA."

      - name: Create the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG exists already."
            exit 0
          fi
          set -- --verify-tag --title "$TAG" --generate-notes --notes "$NOTES"
          if [ -n "$PREVIOUS_TAG" ]; then
            set -- "$@" --notes-start-tag "$PREVIOUS_TAG"
          fi
          gh release create "$TAG" "$@"
